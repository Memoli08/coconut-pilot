[package]
name = "coconut-pilot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Your keyboard, your shortcuts."

[[bin]]
name = "coconut"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
url = "2"
ratatui = "0.30"
crossterm = "0.28"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.20"
evdev = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
